# ===========================================================================
# deploy-docs.yml — the documentation site, when somebody asks for it.
#
# NOT on push, deliberately, and there is no `public/CNAME`: NO DOMAIN HAS BEEN
# CHOSEN. `formcontract.dev` was never registered — it answered NXDOMAIN, which
# is why the rename cost nothing — and picking its replacement is the author's
# call rather than this file's. A CNAME naming a domain nobody owns does not
# fail loudly; it makes Pages serve nothing at an address that does not exist.
# GitHub Pages is also unavailable for this repository while it is private on
# the current plan, so a push trigger would paint every commit with a red X for
# a deployment nobody asked for.
#
# It builds on every pull request instead, which is the half that is worth
# having now: a docs page that stops compiling should fail review, not fail
# silently until the day someone tries to publish it.
#
# `public/CNAME` carries the domain into the artifact, and the build fails
# without it: a deploy missing that file silently drops the custom domain and
# the site answers on github.io instead.
# ===========================================================================
name: Docs

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "examples/showcase/src/md3-tokens.css"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also deploy to GitHub Pages (needs Pages enabled first)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site

      - name: Fail if the CNAME did not reach the artifact
        run: |
          test -f docs-site/dist/CNAME || {
            echo "docs-site/dist/CNAME is missing; a deploy without it drops"
            echo "the custom domain and the site answers on github.io instead."
            exit 1
          }
          cat docs-site/dist/CNAME

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/dist

      - if: inputs.publish
        uses: actions/configure-pages@v5
      - if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site/dist

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
