# ===========================================================================
# deploy-docs.yml — the documentation site, when somebody asks for it.
#
# THERE IS NO `public/CNAME` BECAUSE NO DOMAIN HAS BEEN CHOSEN.
# `formcontract.dev` was never registered — it answered NXDOMAIN, which is why
# the rename cost nothing — and picking its replacement is the author's call
# rather than this file's. A CNAME naming a domain nobody owns does not fail
# loudly; it makes Pages serve nothing at an address that does not exist.
#
# Until one is chosen the site is published where a project site goes:
# https://maroonedog.github.io/waypoint/. That address has a path in it, which
# is what `base` in docs-site/astro.config.mjs exists for. A build that drops
# it still succeeds here and still serves a page with no stylesheet, so the
# thing to open after a publish is the deployed page, not this run's green
# check.
#
# PUBLISHING IS THE DISPATCH INPUT AND NOT A PUSH. On a pull request this
# builds and stops, which is the half that is worth having on every commit: a
# docs page that stops compiling should fail review, not fail silently until
# the day someone tries to publish it. `workflow_dispatch` with `publish` is
# the other half.
#
# If a custom domain is configured, its CNAME must survive the build unchanged.
# Without a configured domain, a build does not need a CNAME.
# ===========================================================================
name: Docs

on:
  # Pages import library source, examples and benchmark artifacts outside
  # docs-site, so changes anywhere in the repository can break their build.
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also deploy to GitHub Pages"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "npm"
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site

      - name: Verify the configured custom domain survives the build
        if: ${{ hashFiles('docs-site/public/CNAME') != '' }}
        run: |
          cmp docs-site/public/CNAME docs-site/dist/CNAME

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/dist

      - if: inputs.publish
        uses: actions/configure-pages@v5
      - if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site/dist

  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
